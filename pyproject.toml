[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-processing-pipeline"
version = "0.1.0"
description = "Modular, sensor-agnostic Earth Observation processing framework (L0 to L1B and beyond)"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "matplotlib>=3.6",
    "pyproj>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
spp-l1b = "spp.cli.run_l1b:main"
spp-l1c = "spp.cli.run_l1c:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
